name: build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: JVM + macOS + iOS simulator
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
          targets: aarch64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bdk-ffi/bdk-ffi
          cache-directories: cargo-build

      - uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: ./gradlew :bdk-kmp:apiCheck :bdk-kmp:jvmTest :bdk-kmp:macosArm64Test :bdk-kmp:iosSimulatorArm64Test --console=plain

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: bdk-kmp/build/test-results/
