name: build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.93.0

jobs:
  apple:
    name: API check, JVM, macOS, iOS simulator
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: zulu
          java-version: 17
      - name: Rust toolchain
        run: rustup toolchain install $RUST_VERSION --profile minimal --target aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: bdk-ffi/bdk-ffi
          cache-directories: cargo-build
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      # No regtest stack on macOS runners (no Linux containers), so the network tests skip here
      # and run in the linux and android jobs instead.
      - name: Offline tests on every Apple-hosted target
        run: ./gradlew :bdk-kmp:apiCheck :bdk-kmp:jvmTest :bdk-kmp:macosArm64Test :bdk-kmp:iosSimulatorArm64Test --console=plain
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: apple-test-results
          path: bdk-kmp/build/test-results/

  linux:
    name: JVM on Linux against regtest
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      bitcoin-regtest:
        image: ghcr.io/thunderbiscuit/podman-regtest-infinity-pro:0.4.0
        ports:
          - 18443:18443
          - 18444:18444
          - 3002:3002
          - 60401:60401
        options: >-
          --health-cmd "test $(bitcoin-cli -regtest -rpcuser=regtest -rpcpassword=password getblockcount) -gt 100"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: zulu
          java-version: 17
      - name: Rust toolchain
        run: rustup toolchain install $RUST_VERSION --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: bdk-ffi/bdk-ffi
          cache-directories: cargo-build
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - name: Full suite, network tests included
        env:
          BDK_REGTEST_HOST: 127.0.0.1
        run: ./gradlew :bdk-kmp:jvmTest --console=plain
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: linux-test-results
          path: bdk-kmp/build/test-results/

  android:
    name: Android emulator against regtest
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      bitcoin-regtest:
        image: ghcr.io/thunderbiscuit/podman-regtest-infinity-pro:0.4.0
        ports:
          - 18443:18443
          - 18444:18444
          - 3002:3002
          - 60401:60401
        options: >-
          --health-cmd "test $(bitcoin-cli -regtest -rpcuser=regtest -rpcpassword=password getblockcount) -gt 100"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: zulu
          java-version: 17
      - name: Android NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "ndk;28.2.13676358" > /dev/null
      - name: Rust toolchain
        run: rustup toolchain install $RUST_VERSION --profile minimal --target x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: bdk-ffi/bdk-ffi
          cache-directories: cargo-build
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      # The emulator reaches the runner, and so the regtest ports, at 10.0.2.2.
      - name: Full suite on an API 34 x86_64 emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ./gradlew :bdk-kmp:connectedAndroidDeviceTest --console=plain
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-test-results
          path: bdk-kmp/build/outputs/androidTest-results/
