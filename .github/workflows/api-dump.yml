name: api-dump

# Regenerates the API dumps on a macOS runner (the klib dump needs every Apple target compiled)
# and uploads them. Download the artifact and commit it under bdk-kmp/api/.
on:
  workflow_dispatch:

jobs:
  dump:
    name: apiDump
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: zulu
          java-version: 17

      - name: Rust toolchain
        run: rustup toolchain install 1.93.0 --profile minimal --target aarch64-apple-ios,aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: bdk-ffi/bdk-ffi
          cache-directories: cargo-build

      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      - name: apiDump
        run: ./gradlew :bdk-kmp:apiDump --console=plain

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: api
          path: bdk-kmp/api/
